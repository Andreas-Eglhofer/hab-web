<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="direction">Waiting for GPS...</h1>
<p id="hab">HAB: Waiting...</p>
<p id="status">Waiting for your location...</p>

<script>
const API = "/api/update";
const rad = Math.PI / 180;

let me = null;
let sat = null;

function point() {
  if (!me || !sat) return;

  const a = me.latitude * rad;
  const b = sat.latitude * rad;
  const d = (sat.longitude - me.longitude) * rad;

  const bearing = (
    Math.atan2(
      Math.sin(d) * Math.cos(b),
      Math.cos(a) * Math.sin(b) -
      Math.sin(a) * Math.cos(b) * Math.cos(d)
    ) / rad + 360
  ) % 360;

  const directions = [
    "N", "NNE", "NE", "ENE",
    "E", "ESE", "SE", "SSE",
    "S", "SSW", "SW", "WSW",
    "W", "WNW", "NW", "NNW"
  ];

  const cardinal =
    directions[Math.round(bearing / 22.5) % 16];

  document.getElementById("direction").textContent =
    `${bearing.toFixed(1)}° from true north (${cardinal})`;
}

navigator.geolocation.watchPosition(
  p => {
    me = p.coords;

    document.getElementById("status").textContent =
      `You: ${me.latitude.toFixed(5)}, ${me.longitude.toFixed(5)}`;

    point();
  },
  e => {
    document.getElementById("status").textContent =
      "Location error: " + e.message;
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 20000
  }
);

async function update() {
  try {
    const res = await fetch(API, { cache: "no-store" });

    if (!res.ok) throw new Error(res.status);

    const data = await res.json();

    document.getElementById("hab").textContent =
      `Latitude: ${data.latitude} ` +
      `Longitude: ${data.longitude} ` +
      `Altitude: ${data.altitude} m`;

    if (
      data.gpsValid &&
      Number(data.gpsFix) > 0 &&
      Number.isFinite(Number(data.latitude)) &&
      Number.isFinite(Number(data.longitude)) &&
      !(Number(data.latitude) === 0 &&
        Number(data.longitude) === 0)
    ) {
      sat = {
        latitude: Number(data.latitude),
        longitude: Number(data.longitude)
      };

      point();
    } else if (!sat) {
      document.getElementById("direction").textContent =
        "Waiting for HAB GPS fix...";
    }

  } catch (e) {
    document.getElementById("hab").textContent =
      "API error: " + e.message;
  }
}

update();
setInterval(update, 2000);
</script>

</body>
</html>
